function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

const LIM = dy => dy > 0 ? 5 : dy === 0 ? 4 : dy === -1 ? 4 : dy === -2 ? 3 : dy === -3 ? 2 : 0;
function genLevel(n) {
  const R = rng(n * 7919 + 13), ri = (a, b) => a + Math.floor(R() * (b - a + 1)), ch = p => R() < p;
  const d = (n - 1) / (NSTAGE - 1), boss = n === NSTAGE;
  const target = boss ? 150 : 100 + n * 24;
  const cmds = [['p', 2, 12], ['g', 0, 11, 13]];
  let x = 12, top = 13, lastItem = 0, lastSlime = 0;
  const slimeP = 0.1 + 0.12 * d, redP = n >= 4 ? 0.15 + 0.4 * d : 0;
  const slime = (sx, row) => { if (sx < 18 || sx - lastSlime < 3) return; lastSlime = sx; cmds.push([ch(redP) ? 'r' : 'm', sx, row]); };
  const item = (ix, row) => { if (ix - lastItem < 22) return; lastItem = ix; cmds.push([ch(0.6 - 0.25 * d) ? 'h' : 'c', ix, row]); };
  const run = (L, stuff = true) => {
    cmds.push(['g', x, x + L - 1, top]);
    if (stuff) {
      for (let i = 2; i < L - 1; i++) if (ch(slimeP)) slime(x + i, top - 1);
      if (L >= 7 && ch(0.3)) { const bw = ri(2, 4), bx = x + ri(1, L - bw - 1); cmds.push(['b', bx, top - 3, bw, 1]); if (ch(0.5)) item(bx + (bw >> 1), top - 4); }
      else if (ch(0.18)) item(x + (L >> 1), top - 3);
    }
    x += L;
  };
  const pick = () => {
    const w = { run: 3, gap: 2 + 2 * d, step: 1.5, spikes: 1 + d, stairs: 0.7 };
    if (n >= 2) w.plats = 1 + 2 * d;
    if (n >= 4) w.field = 1.6 * d;
    let tot = 0; for (const k in w) tot += w[k];
    let r = R() * tot; for (const k in w) { r -= w[k]; if (r <= 0) return k; }
    return 'run';
  };
  while (x < target) {
    const t = pick();
    if (t === 'run') run(ri(6, 12));
    else if (t === 'gap') {
      const gw = ri(2, 2 + Math.round(d));
      let nt = clamp(top + ri(-2, 2), 8, 13);
      while (gw + 1 > LIM(nt - top)) nt++;
      x += gw; top = nt; run(ri(4, 8));
    } else if (t === 'step') {
      top = clamp(top + (ch(0.5) ? -1 : 1) * ri(1, 2), 8, 13); run(ri(5, 10));
    } else if (t === 'spikes') {
      const L = ri(8, 12), sw = ri(1, 1 + Math.round(2 * d));
      cmds.push(['g', x, x + L - 1, top]);
      const s0 = x + ri(2, L - sw - 2);
      cmds.push(['s', s0, s0 + sw - 1, top - 1]);
      x += L;
    } else if (t === 'stairs') {
      cmds.push(['g', x, x + 2, top], ['g', x + 5, x + 7, top]);
      for (let i = 0; i < 3; i++) { cmds.push(['b', x + i, top - 1 - i, 1, i + 1]); cmds.push(['b', x + 7 - i, top - 1 - i, 1, i + 1]); }
      x += 8; run(ri(3, 6));
    } else if (t === 'plats') {
      let cs = top - 1, ce = x - 1;
      const cnt = ri(2, 2 + Math.round(2 * d));
      for (let k = 0; k < cnt; k++) {
        let gapT = ri(1, 2), ns = clamp(cs + ri(-2, 2), 5, 11), dy = ns - cs;
        while (gapT + 1 > LIM(dy)) { if (gapT > 1) gapT--; else { ns++; dy = ns - cs; } }
        const pl = ri(2, 4 - Math.round(d)), px = ce + 1 + gapT;
        cmds.push(['o', px, ns + 1, pl]);
        if (ch(0.15)) item(px + (pl >> 1), ns - 1);
        if (pl >= 3 && ch(0.35 * d)) cmds.push([ch(redP) ? 'r' : 'm', px + 1, ns]);
        cs = ns; ce = px + pl - 1;
      }
      top = clamp(cs + 1 + ri(0, 2), 8, 13);
      x = ce + 1 + ri(1, 2); run(ri(4, 8));

      const L = ri(10, 14);
      cmds.push(['g', x, x + L - 1, top]);
      const e = x + L - 3;
      cmds.push(['s', x + 2, e, top - 1]);
      for (let p = x + 2; p + 1 <= e; p += 4) cmds.push(['o', p, top - 3, 2]);
      x += L; run(ri(3, 6), false);
    }
  }

  if (!boss) {
    cmds.push(['g', x, x + 17, top], ['f', x + 12, top - 1]);

    cmds.push(['g', x, x + 37, 13], ['o', x + 8, 10, 4], ['o', x + 26, 10, 4], ['h', x + 9, 9], ['h', x + 27, 9]);
    x += 38;
  }
  return { w: x, cmds, arena };
}

function buildLevel(def) {
  const g = [];
  for (let r = 0; r < LH; r++) g.push(new Array(def.w).fill('.'));
  const L = { w: def.w, g, slimes: [], items: [], start: null, flag: null, arena: def.arena };
  for (const [t, ...a] of def.cmds) {
    if (t === 'g') { for (let x = a[0]; x <= a[1]; x++) for (let r = a[2]; r < LH; r++) g[r][x] = '#'; }
    else if (t === 'b') { for (let x = a[0]; x < a[0] + a[2]; x++) for (let r = a[1]; r < a[1] + a[3]; r++) g[r][x] = '='; }
    else if (t === 'o') { for (let x = a[0]; x < a[0] + a[2]; x++) if (g[a[1]][x] === '.') g[a[1]][x] = '-'; }
    else if (t === 's') { for (let x = a[0]; x <= a[1]; x++) g[a[2]][x] = '^'; }
    else if (t === 'm' || t === 'r') L.slimes.push({ tx: a[0], ty: a[1], red: t === 'r' });
    else if (t === 'h') L.items.push({ type: 'potion', tx: a[0], ty: a[1] });
    else if (t === 'c') L.items.push({ type: 'chest', tx: a[0], ty: a[1] });
    else if (t === 'p') L.start = { tx: a[0], ty: a[1] };
    else if (t === 'f') L.flag = { tx: a[0], ty: a[1] };
  }
  // 아이템·괴물이 땅/벽돌 속에 묻히지 않게 정리
  const free = (tx, ty) => ty >= 0 && ty < LH && (g[ty][tx] === '.' || g[ty][tx] === '-');
  L.items = L.items.filter(it => free(it.tx, it.ty));
  L.slimes = L.slimes.filter(s => free(s.tx, s.ty) && g[s.ty][s.tx] !== '^');
  return L;
}
